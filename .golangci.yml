run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters-settings:
  errcheck:
    check-type-assertions: true
  goconst:
    min-len: 2
    min-occurrences: 3
  gocyclo:
    min-complexity: 15
  gofmt:
    simplify: true
  goimports:
    local-prefixes: financial-backend
  govet:
    check-shadowing: true
  misspell:
    locale: US
  revive:
    min-confidence: 0
  staticcheck:
    go: "1.23"

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gofmt
    # Disabled for less strict checking:
    # - goimports
    # - misspell
    # - revive
    # - goconst
    # - gocyclo

issues:
  exclude-rules:
    # Disable linting for test files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - gosec
        - unused
    # Disable linting for mocks
    - path: mocks/
      linters:
        - revive
        - unused
        - errcheck
    # Disable specific rules for main.go
    - path: cmd/
      linters:
        - errcheck
    # Disable errcheck for specific patterns
    - text: "Error return value.*is not checked"
      linters:
        - errcheck
    # Disable unused parameter warnings
    - text: "parameter.*seems to be unused"
      linters:
        - unused